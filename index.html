<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moss is an iPhone app for blocking distracting apps with an NFC tag.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Moss">
  <meta property="og:description" content="Block distracting apps with a tap of an NFC tag.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mosscomputer.com/">
  <link rel="canonical" href="https://mosscomputer.com/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='white'/%3E%3Ctext x='50' y='77' text-anchor='middle' font-size='90'%3E✴%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <title>Moss</title>
  <script type="module" src="script.js"></script>
</head>
<body>
  <div class="page">
    <header><span>Moss</span><span>iPhone + NFC</span></header>
    <main>
      <section class="hero" aria-labelledby="name">
        <div>
          <h1 id="name">Moss</h1>
          <p class="intro">Block distracting apps with a tap of an NFC tag.</p>
          <p class="soon">In development.</p>
        </div>
        <figure>
          <button class="screen" type="button" aria-label="Block apps in the preview and grow moss" aria-pressed="false" aria-describedby="preview-note">
            <canvas id="moss" width="144" height="144" aria-hidden="true"></canvas>
          </button>
          <figcaption><span id="preview-note">Tap to block</span><span id="state" role="status">Apps available</span></figcaption>
        </figure>
      </section>
      <section class="notes" aria-label="How it works">
        <ol>
          <li>Choose your apps.</li>
          <li>Pair an NFC tag.</li>
          <li>Tap to block or unblock.</li>
        </ol>
      </section>
    </main>
    <footer><span>Moss © 2026</span></footer>
  </div>
</body>
</html>
