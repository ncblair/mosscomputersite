<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moss is an iPhone app for blocking distracting apps with an NFC tag.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Moss Computer">
  <meta property="og:description" content="Block distracting apps with a tap of an NFC tag.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mosscomputer.com/">
  <link rel="canonical" href="https://mosscomputer.com/">
  <link rel="icon" href="assets/computer-image-2.png">
  <link rel="stylesheet" href="style.css">
  <title>Moss Computer</title>
  <script type="module" src="script.js"></script>
</head>
<body>
  <div class="page">
    <header><span class="header-brand" aria-label="Moss Computer">Moss <img class="brand-icon" src="assets/computer-image-2.png" width="28" height="24" alt="Computer"></span><span>iPhone + NFC</span></header>
    <main>
      <section class="hero" aria-labelledby="name">
        <div>
          <h1 id="name" aria-label="Moss Computer"><canvas class="moss-layer back" aria-hidden="true"></canvas><span data-ink>Moss</span><img data-ink class="brand-icon" src="assets/computer-image-2.png" width="592" height="526" alt=""><canvas class="moss-layer front" aria-hidden="true"></canvas></h1>
          <p class="intro">Block distracting apps with a tap of an NFC tag.</p>
          <p class="soon">In development.</p>
        </div>
        <figure>
          <button class="screen" type="button" aria-label="Block apps in the preview and grow moss" aria-pressed="false" aria-describedby="preview-note">
            <span class="icon-field">
              <canvas class="moss-layer back" aria-hidden="true"></canvas>
              <img class="icon" src="assets/computer-image-2.png" width="128" height="128" alt="">
              <canvas class="moss-layer front" aria-hidden="true"></canvas>
            </span>
          </button>
          <figcaption><span id="preview-note">Tap to block</span><span id="state" role="status">Apps available</span></figcaption>
        </figure>
      </section>
      <section class="notes" aria-label="How it works">
        <ol>
          <li>Choose your apps.</li>
          <li>Pair an NFC tag.</li>
          <li>Tap to block or unblock.</li>
        </ol>
      </section>
    </main>
    <footer><span>Moss © 2026</span></footer>
  </div>
</body>
</html>
