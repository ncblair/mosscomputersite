<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moss Computer blocks distracting apps from your iPhone with old transit cards, hotel keys, or any other NFC tags - for free.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Moss Computer">
  <meta property="og:description" content="Blocks distracting apps from your iPhone with old transit cards, hotel keys, or any other NFC tags - for free.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mosscomputer.com/">
  <link rel="canonical" href="https://mosscomputer.com/">
  <link rel="icon" href="assets/computer-geometric.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Moss Computer</title>
  <script type="module" src="script.js"></script>
</head>
<body>
  <div class="page">
    <header><span>Moss Computer</span></header>
    <main>
      <section class="hero" aria-labelledby="name">
        <div>
          <h1 id="name"><canvas class="moss-layer back" aria-hidden="true"></canvas><span data-ink>Moss</span> <span data-ink>Computer</span><canvas class="moss-layer front" aria-hidden="true"></canvas></h1>
          <p class="intro">blocks distracting apps from your iPhone with old transit cards, hotel keys, or any other NFC tags - for free</p>
          <p class="soon">In development.</p>
        </div>
        <figure>
          <button class="screen" type="button" aria-label="Block apps in the preview and grow moss" aria-pressed="false" aria-describedby="preview-note">
            <span class="icon-field">
              <canvas class="moss-layer back" aria-hidden="true"></canvas>
              <img class="icon" src="assets/computer-geometric.svg" width="128" height="100" alt="">
              <canvas class="moss-layer front" aria-hidden="true"></canvas>
            </span>
          </button>
          <figcaption><span id="preview-note">Tap to block</span><span id="state" role="status">Apps available</span></figcaption>
        </figure>
      </section>
    </main>
    <footer><span>Nathan Blair © 2026</span></footer>
  </div>
</body>
</html>
